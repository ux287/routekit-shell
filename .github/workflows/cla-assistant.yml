name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          # PRIVACY: signatures contain contributor names and email addresses.
          # They are written to a SEPARATE PRIVATE REPOSITORY, never to this repo,
          # so they cannot be picked up by .routekit/publish-profiles.yaml and
          # force-pushed to the public mirror.
          remote-organization-name: ux287
          remote-repository-name: routekit-cla-signatures
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/ux287/routekit-shell/blob/main/CLA.md
          branch: main
          allowlist: dependabot[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: 'Thank you for your contribution. rks is dual-licensed (AGPL-3.0-or-later plus a commercial licence), so we need a signed CLA before this can be accepted. Please read the CLA and then comment with the exact sentence below.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
