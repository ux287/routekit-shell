name: secret-scan

# Server-side secret scanning. The pre-commit hook in .routekit/git-hooks is a
# client-side control and can always be declined by the client: an unconfigured
# clone, a fork PR, or `git commit --no-verify`. This gate cannot be declined.
#
# Fork-safe: `pull_request` (never `pull_request_target`) runs fork PRs with a
# read-only token and no secrets, which is all the scan needs. No path filter:
# a secret can be committed in exactly the docs/config files ci.yml skips.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same pinned scanner as the local hook: version, asset and SHA-256 come from
      # the pin file named by PIN below (backlog.security.gitleaks-gate-arming). No
      # version literal lives in this file, so a pin bump is a one-file change. The
      # pin path is written only once, in the step, so the unit test that requires
      # it cannot be satisfied by this comment alone.
      #
      # On pull_request the pin comes from the PR base SHA, never the PR tree, so a
      # PR cannot repoint the download and its expected hash at the same time
      # (backlog.security.secret-scan-config-from-base-ref). A failed git show
      # fails the job: there is no fallback to the PR-tree copy. The path actually
      # read is recorded for the flag step below.
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PIN="${RUNNER_TEMP}/gitleaks-pin.base.json"
            git show "${PR_BASE}:scripts/gitleaks-pin.json" > "$PIN"
          else
            PIN=scripts/gitleaks-pin.json
          fi
          echo "PIN_USED=${PIN}" >> "${RUNNER_TEMP}/secret-scan-inputs.env"
          echo "Secret-scan scanner pin used: ${PIN}" >> "$GITHUB_STEP_SUMMARY"
          BASE="$(jq -r '.baseUrl' "$PIN")"
          FILE="$(jq -r '.assets["linux-x64"].file' "$PIN")"
          SHA="$(jq -r '.assets["linux-x64"].sha256' "$PIN")"
          curl -sSfL --retry 5 --retry-delay 5 --retry-max-time 300 --retry-connrefused --max-time 120 -o "/tmp/${FILE}" "${BASE}${FILE}" || { rc=$?; echo "::error::gitleaks download failed (curl exit ${rc}); failing closed before checksum verification" >&2; exit "$rc"; }
          echo "${SHA}  /tmp/${FILE}" | sha256sum -c -
          tar -xzf "/tmp/${FILE}" -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Fails the check on any finding: --exit-code 1, set -euo pipefail, and no
      # continue-on-error. --redact keeps a caught secret out of the CI log.
      # On pull_request the config comes from the PR base SHA, never the PR tree,
      # so a PR cannot allowlist its own secret. The config path is recorded
      # BEFORE the scan runs, because a finding exits non-zero.
      - name: Scan for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE}..${HEAD_SHA}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${PUSH_BEFORE}..${HEAD_SHA}"
          else
            # New branch: no prior tip, so scan everything reachable (fail-safe direction).
            RANGE="${HEAD_SHA}"
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            CONFIG="${RUNNER_TEMP}/gitleaks.base.toml"
            git show "${PR_BASE}:.gitleaks.toml" > "$CONFIG"
          else
            CONFIG=.gitleaks.toml
          fi
          echo "CONFIG_USED=${CONFIG}" >> "${RUNNER_TEMP}/secret-scan-inputs.env"
          echo "Secret-scan config used: ${CONFIG}" >> "$GITHUB_STEP_SUMMARY"
          gitleaks detect --source . --config "${CONFIG}" --redact --exit-code 1 --log-opts="${RANGE}"

      # Never silent: name every secret-scan input this PR changes, with the config
      # and pin paths the steps above recorded. Runs even when the scan failed.
      # Reports only; it does not fail the job on a change, but a git diff failure
      # is not masked. The record is read by line match, never sourced. The record
      # is the steps' own report: a PR that edits this workflow can falsify it.
      - name: Flag changes to secret-scan inputs
        if: always() && github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REC="${RUNNER_TEMP}/secret-scan-inputs.env"
          CONFIG_REC=""
          PIN_REC=""
          if [ -f "$REC" ]; then
            CONFIG_REC="$(sed -n 's/^CONFIG_USED=//p' "$REC" | tail -n 1)"
            PIN_REC="$(sed -n 's/^PIN_USED=//p' "$REC" | tail -n 1)"
          fi
          describe() {
            if [ -z "$2" ]; then
              echo "$1: unknown (no record)"
            elif [ "$2" = "$3" ]; then
              echo "$1: base-branch copy ($2)"
            else
              echo "$1: $2 (not the base-branch copy)"
            fi
          }
          CONFIG_TEXT="$(describe "scan config used" "$CONFIG_REC" "${RUNNER_TEMP}/gitleaks.base.toml")"
          PIN_TEXT="$(describe "scanner pin used" "$PIN_REC" "${RUNNER_TEMP}/gitleaks-pin.base.json")"
          CHANGED="$(git diff --name-only "${PR_BASE}...${HEAD_SHA}" -- .gitleaks.toml scripts/gitleaks-pin.json .github/workflows/)"
          FLAGGED=""
          while IFS= read -r p; do
            case "$p" in
              .gitleaks.toml|scripts/gitleaks-pin.json|.github/workflows/*) ;;
              *) continue ;;
            esac
            echo "::warning file=${p}::This PR changes a secret-scan input (${p}); ${CONFIG_TEXT}; ${PIN_TEXT}"
            FLAGGED="${FLAGGED}- ${p}"$'\n'
          done <<< "$CHANGED"
          {
            if [ -n "$FLAGGED" ]; then
              echo "### This PR changes secret-scan inputs"
              printf '%s' "$FLAGGED"
            else
              echo "No secret-scan inputs changed by this PR."
            fi
            echo "- ${CONFIG_TEXT}"
            echo "- ${PIN_TEXT}"
          } >> "$GITHUB_STEP_SUMMARY"
